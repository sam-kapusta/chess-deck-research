<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess Blunder Atlas</title>
<style>
:root {
  --bg: #0f0f14;
  --bg2: #1a1a22;
  --bg3: #222230;
  --border: #2a2a3a;
  --border2: #3a3a4f;
  --text: #e4e4e7;
  --muted: #8a8a9f;
  --faint: #2e2e40;
  --accent: #a78bfa;
  --accent2: #7c5cbf;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
}

#topbar {
  height: 48px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  flex-shrink: 0;
  background: var(--bg2);
}
#topbar .logo { font-size: 15px; font-weight: 600; color: var(--accent); }
#topbar .stats { margin-left: auto; font-size: 11px; color: var(--muted); display: flex; gap: 16px; }
#topbar .stats b { color: var(--accent); font-weight: 400; }

#app { display: flex; flex: 1; overflow: hidden; }

#sidebar {
  width: 240px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  background: var(--bg2);
  padding: 12px 0;
}
#sidebar::-webkit-scrollbar { width: 3px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--faint); }

.cat-btn {
  width: 100%;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 11px;
  text-align: left;
  transition: all .12s;
  border-left: 2px solid transparent;
}
.cat-btn:hover { background: var(--bg3); color: var(--text); }
.cat-btn.active { background: var(--bg3); color: var(--text); border-left-color: var(--accent); }
.cat-btn .n { font-size: 10px; color: var(--muted); margin-left: auto; }

#main { flex: 1; overflow-y: auto; padding: 28px 32px; }
#main::-webkit-scrollbar { width: 4px; }
#main::-webkit-scrollbar-thumb { background: var(--faint); }

.section-head {
  display: flex; align-items: baseline; gap: 14px;
  margin-bottom: 8px;
}
.section-head h2 { font-size: 20px; font-weight: 600; }
.section-head .tag { font-size: 10px; color: var(--muted); background: var(--bg3); border: 1px solid var(--border2); padding: 2px 8px; border-radius: 3px; }
.section-desc { font-size: 12px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }

.cluster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.cluster-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all .14s;
}
.cluster-card:hover { border-color: var(--border2); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.cluster-card.expanded { border-color: var(--accent); }
.card-name { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.card-meta { font-size: 10px; color: var(--muted); }
.card-features { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); display: none; font-size: 10px; color: var(--muted); }
.cluster-card.expanded .card-features { display: block; }
.feat-row { padding: 3px 0; border-bottom: 1px solid var(--faint); }

.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.home-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  cursor: pointer;
  transition: all .14s;
}
.home-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.home-name { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
.home-stats { font-size: 10px; color: var(--muted); }
.home-stats b { color: var(--accent); font-weight: 400; }
</style>
</head>

let currentCat = null;

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '<button class="cat-btn active" onclick="showHome()">All categories<span class="n">20</span></button>';
  DATA.children.forEach((cat, i) => {
    html += `<button class="cat-btn" onclick="showCategory(${i})" id="btn-${i}">${cat.name}<span class="n">${cat.n_features}</span></button>`;
  });
  sb.innerHTML = html;
}

function showHome() {
  currentCat = null;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.cat-btn').classList.add('active');

  const main = document.getElementById('main');
  let html = '<div class="section-head"><h2>Chess Blunder Atlas</h2><div class="tag">v2 k=16 SAE</div></div>';
  html += '<div class="section-desc">20 coaching categories discovered from 2048 SAE features via decoder cosine clustering + Opus LLM re-grouping. Click a category to explore its sub-patterns.</div>';
  html += '<div class="home-grid">';
  DATA.children.forEach((cat, i) => {
    html += `<div class="home-card" onclick="showCategory(${i})">
      <div class="home-name">${cat.name}</div>
      <div class="home-stats"><b>${cat.n_features}</b> features · <b>${cat.children.length}</b> sub-patterns</div>
    </div>`;
  });
  html += '</div>';
  main.innerHTML = html;
}

function showCategory(idx) {
  currentCat = idx;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + idx).classList.add('active');

  const cat = DATA.children[idx];
  const main = document.getElementById('main');
  let html = `<div class="section-head"><h2>${cat.name}</h2><div class="tag">${cat.n_features} features</div></div>`;
  html += `<div class="section-desc">${cat.description || ''}</div>`;
  html += '<div class="cluster-grid">';
  cat.children.forEach((sc, si) => {
    html += `<div class="cluster-card" onclick="toggleCard(this)">
      <div class="card-name">${sc.name}</div>
      <div class="card-meta">${sc.size} features</div>
      <div class="card-features">${sc.features.map(f => `<div class="feat-row">Feature #${f}</div>`).join('')}</div>
    </div>`;
  });
  html += '</div>';
  main.innerHTML = html;
}

function toggleCard(el) {
  el.classList.toggle('expanded');
}

renderSidebar();
showHome();
</script>
